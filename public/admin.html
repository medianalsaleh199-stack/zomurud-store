<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOMURUD STORE - لوحة التحكم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header .top {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 14px 50px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    h3 {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .green {
      background: #16834a;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .gray {
      background: #e5e7eb;
      color: #111;
    }

    .upload-box {
      border: 3px dashed #c9cdd3;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      margin-top: 15px;
      background: #fafafa;
    }

    .upload-box .big {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .upload-button {
      display: inline-block;
      background: #111827;
      color: white;
      padding: 13px 20px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
    }

    #imageFiles {
      display: none;
    }

    #uploadStatus {
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.7;
    }

    .images-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .image-card {
      position: relative;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    .image-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    .image-info {
      padding: 8px;
      font-size: 11px;
      direction: ltr;
      word-break: break-all;
    }

    .image-actions {
      display: flex;
      gap: 5px;
      padding: 7px;
    }

    .image-actions button {
      flex: 1;
      padding: 8px;
      font-size: 12px;
    }

    .main-badge {
      position: absolute;
      top: 7px;
      right: 7px;
      background: #16834a;
      color: white;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px;
      z-index: 2;
    }

    .url-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .url-row input {
      direction: ltr;
      text-align: left;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      background: white;
    }

    .product-row {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .product-row img {
      width: 90px;
      height: 70px;
      object-fit: cover;
      border-radius: 9px;
      background: #eee;
    }

    .product-info {
      flex: 1;
    }

    .product-info strong {
      font-size: 17px;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    .status {
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      background: #f3f4f6;
    }

    .order {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
      background: white;
    }

    .order strong {
      font-size: 17px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .option {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .images-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .product-row {
        align-items: flex-start;
      }

      .product-row img {
        width: 75px;
        height: 65px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <h1>💎 ZOMURUD STORE</h1>
    <button class="gray" onclick="logout()">تسجيل الخروج</button>
  </div>
</header>

<div class="container">

  <!-- المنتجات -->
  <div class="card">
    <h2>🛍️ المنتجات</h2>

    <button class="green" onclick="newProduct()">
      ＋ إضافة منتج جديد
    </button>

    <div id="productsList" style="margin-top:18px;"></div>
  </div>


  <!-- نموذج المنتج -->
  <div class="card" id="productForm">

    <h2 id="formTitle">➕ إضافة منتج</h2>

    <input type="hidden" id="productId">

    <div class="grid">

      <div>
        <label>اسم المنتج بالعربي</label>
        <input id="nameAr" placeholder="مثال: طاولة عرض">
      </div>

      <div>
        <label>اسم المنتج بالإنجليزي</label>
        <input id="nameEn" placeholder="Display Table">
      </div>

      <div>
        <label>التصنيف</label>
        <input id="category" placeholder="Tables / Booths / Carts">
      </div>

      <div>
        <label>المخزون</label>
        <input id="stock" type="number" value="0">
      </div>

      <div>
        <label>السعر</label>
        <input id="price" type="number" step="0.01" placeholder="2500">
      </div>

      <div>
        <label>السعر قبل الخصم</label>
        <input id="comparePrice" type="number" step="0.01">
      </div>

    </div>

    <label>الوصف بالعربي</label>
    <textarea id="descriptionAr"></textarea>

    <label>الوصف بالإنجليزي</label>
    <textarea id="descriptionEn"></textarea>


    <!-- الصور -->
    <hr style="margin:25px 0">

    <h2>📸 صور المنتج</h2>

    <div class="upload-box">

      <div class="big">
        اختر عدة صور من الهاتف
      </div>

      <div>
        يمكنك اختيار عدة صور دفعة واحدة
      </div>

      <label for="imageFiles" class="upload-button">
        📷 اختيار الصور
      </label>

      <input
        id="imageFiles"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        multiple
      >

      <div id="uploadStatus"></div>

    </div>

    <div id="imagesGrid" class="images-grid"></div>


    <!-- روابط يدوية -->
    <div style="margin-top:25px">

      <h3>🔗 روابط الصور المرفوعة</h3>

      <div id="manualUrls"></div>

      <button class="gray" onclick="addManualUrl()">
        ＋ إضافة رابط صورة
      </button>

    </div>


    <!-- الخيارات -->
    <hr style="margin:25px 0">

    <h2>⚙️ خيارات المنتج</h2>

    <div id="optionsList"></div>

    <button class="gray" onclick="addOption()">
      ＋ إضافة خيار
    </button>


    <!-- حفظ -->
    <hr style="margin:25px 0">

    <div class="actions">

      <button class="green" onclick="saveProduct()">
        💾 حفظ المنتج
      </button>

      <button class="gray" onclick="newProduct()">
        إلغاء
      </button>

    </div>

    <div id="saveStatus" class="status hidden"></div>

  </div>


  <!-- الطلبات -->
  <div class="card">

    <h2>📦 الطلبات</h2>

    <div id="ordersList"></div>

  </div>

</div>


<script>

const CLOUD_NAME = "kdksxxgu";
const UPLOAD_PRESET = "zomurud_store";

let uploadedImages = [];
let productOptions = [];


// ==========================================
// التحقق من تسجيل الدخول
// ==========================================

async function checkAuth() {

  try {

    const res = await fetch("/api/admin/me", {
      credentials: "include"
    });

    if (!res.ok) {
      window.location.href = "/admin-login.html";
      return false;
    }

    return true;

  } catch (err) {

    window.location.href = "/admin-login.html";
    return false;
  }
}


// ==========================================
// تسجيل الخروج
// ==========================================

async function logout() {

  try {
    await fetch("/api/admin/logout", {
      method: "POST",
      credentials: "include"
    });
  } catch (e) {}

  window.location.href = "/admin-login.html";
}


// ==========================================
// تحميل المنتجات
// ==========================================

async function loadProducts() {

  const box = document.getElementById("productsList");

  box.innerHTML = "جاري تحميل المنتجات...";

  try {

    const res = await fetch("/api/admin/products", {
      credentials: "include"
    });

    if (!res.ok) {
      box.innerHTML = "تعذر تحميل المنتجات";
      return;
    }

    const products = await res.json();

    if (!products.length) {

      box.innerHTML = `
        <div class="empty">
          لا توجد منتجات حتى الآن
        </div>
      `;

      return;
    }

    box.innerHTML = products.map(product => {

      const image =
        product.image ||
        (product.images && product.images[0] && product.images[0].url) ||
        "";

      return `
        <div class="product">

          <div class="product-row">

            ${
              image
              ? `<img src="${escapeHtml(image)}" onerror="this.style.display='none'">`
              : `<div style="width:90px;height:70px;background:#eee;border-radius:9px"></div>`
            }

            <div class="product-info">

              <strong>
                ${escapeHtml(product.name_ar || product.name_en || "بدون اسم")}
              </strong>

              <div>
                ${Number(product.price || 0).toFixed(2)}
              </div>

              <small>
                المخزون: ${product.stock ?? 0}
              </small>

            </div>

          </div>

          <div class="actions">

            <button class="primary"
              onclick='editProduct(${JSON.stringify(product)})'>
              ✏️ تعديل
            </button>

            <button class="danger"
              onclick="deleteProduct(${product.id})">
              🗑️ حذف
            </button>

          </div>

        </div>
      `;

    }).join("");

  } catch (err) {

    console.error(err);

    box.innerHTML = `
      <div class="status">
        حدث خطأ أثناء تحميل المنتجات
      </div>
    `;
  }
}


// ==========================================
// منتج جديد
// ==========================================

function newProduct() {

  document.getElementById("formTitle").textContent =
    "➕ إضافة منتج";

  document.getElementById("productId").value = "";

  document.getElementById("nameAr").value = "";
  document.getElementById("nameEn").value = "";
  document.getElementById("category").value = "";
  document.getElementById("stock").value = "0";
  document.getElementById("price").value = "";
  document.getElementById("comparePrice").value = "";
  document.getElementById("descriptionAr").value = "";
  document.getElementById("descriptionEn").value = "";

  uploadedImages = [];
  productOptions = [];

  renderImages();
  renderOptions();

  document.getElementById("manualUrls").innerHTML = "";

  document.getElementById("saveStatus").classList.add("hidden");

  window.scrollTo({
    top: document.getElementById("productForm").offsetTop - 70,
    behavior: "smooth"
  });
}


// ==========================================
// اختيار الصور
// ==========================================

document.getElementById("imageFiles").addEventListener(
  "change",
  uploadImages
);


// ==========================================
// رفع عدة صور إلى Cloudinary
// ==========================================

async function uploadImages() {

  const input = document.getElementById("imageFiles");
  const status = document.getElementById("uploadStatus");

  const files = Array.from(input.files || []);

  if (!files.length) {

    status.innerHTML =
      "⚠️ لم يتم اختيار أي ملف.";

    return;
  }

  status.innerHTML =
    `⏳ جاري رفع ${files.length} صورة...`;

  let successCount = 0;
  let failCount = 0;

  for (let i = 0; i < files.length; i++) {

    const file = files[i];

    try {

      status.innerHTML =
        `⏳ جاري رفع الصورة ${i + 1} من ${files.length}...`;

      const formData = new FormData();

      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", "zomurud");

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        {
          method: "POST",
          body: formData
        }
      );

      const data = await response.json();

      console.log("Cloudinary:", data);

      if (!response.ok || !data.secure_url) {

        console.error("Upload failed:", data);

        failCount++;

        continue;
      }

      uploadedImages.push({
        url: data.secure_url,
        public_id: data.public_id || "",
        original_name: file.name
      });

      successCount++;

      renderImages();

    } catch (error) {

      console.error(error);

      failCount++;
    }
  }

  input.value = "";

  if (successCount > 0 && failCount === 0) {

    status.innerHTML =
      `✅ تم رفع ${successCount} صورة بنجاح`;

  } else if (successCount > 0 && failCount > 0) {

    status.innerHTML =
      `⚠️ تم رفع ${successCount} صور، وفشل رفع ${failCount} صور`;

  } else {

    status.innerHTML =
      `❌ فشل رفع الصور. تحقق من Cloudinary Upload Preset.`;
  }
}


// ==========================================
// عرض الصور
// ==========================================

function renderImages() {

  const grid = document.getElementById("imagesGrid");

  if (!uploadedImages.length) {

    grid.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;color:#777;padding:20px">
        لم تتم إضافة صور بعد
      </div>
    `;

    return;
  }

  grid.innerHTML = uploadedImages.map((image, index) => {

    return `

      <div class="image-card">

        ${
          index === 0
          ? `<div class="main-badge">الصورة الرئيسية</div>`
          : ""
        }

        <img
          src="${escapeHtml(image.url)}"
          onerror="this.style.opacity='.3'"
        >

        <div class="image-info">
          ${escapeHtml(image.url)}
        </div>

        <div class="image-actions">

          ${
            index !== 0
            ? `
              <button
                class="green"
                onclick="makeMainImage(${index})">
                الرئيسية
              </button>
            `
            : ""
          }

          <button
            class="danger"
            onclick="removeImage(${index})">
            حذف
          </button>

        </div>

      </div>
    `;

  }).join("");
}


// ==========================================
// جعل صورة رئيسية
// ==========================================

function makeMainImage(index) {

  const selected = uploadedImages[index];

  uploadedImages.splice(index, 1);

  uploadedImages.unshift(selected);

  renderImages();
}


// ==========================================
// حذف صورة
// ==========================================

function removeImage(index) {

  if (!confirm("هل تريد حذف هذه الصورة من المنتج؟")) {
    return;
  }

  uploadedImages.splice(index, 1);

  renderImages();
}


// ==========================================
// إضافة رابط صورة يدوي
// ==========================================

function addManualUrl(value = "") {

  const box = document.getElementById("manualUrls");

  const row = document.createElement("div");

  row.className = "url-row";

  row.innerHTML = `

    <input
      class="manual-url"
      placeholder="https://..."
      value="${escapeHtml(value)}"
    >

    <button
      class="danger"
      onclick="this.parentElement.remove()">
      ×
    </button>

  `;

  box.appendChild(row);
}


// ==========================================
// الخيارات
// ==========================================

function addOption(option = null) {

  const item = option || {

    name_ar: "",
    name_en: "",
    type: "select",
    required: false,
    values: []

  };

  productOptions.push(item);

  renderOptions();
}


function renderOptions() {

  const box = document.getElementById("optionsList");

  box.innerHTML = "";

  productOptions.forEach((option, index) => {

    const div = document.createElement("div");

    div.className = "option";

    div.innerHTML = `

      <h3>الخيار ${index + 1}</h3>

      <label>اسم الخيار بالعربي</label>

      <input
        class="option-ar"
        value="${escapeHtml(option.name_ar || "")}"
        placeholder="اللون">

      <label>اسم الخيار بالإنجليزي</label>

      <input
        class="option-en"
        value="${escapeHtml(option.name_en || "")}"
        placeholder="Color">

      <label>نوع الخيار</label>

      <select class="option-type">

        <option value="select"
          ${option.type === "select" ? "selected" : ""}>
          قائمة اختيار
        </option>

        <option value="radio"
          ${option.type === "radio" ? "selected" : ""}>
          اختيار واحد
        </option>

      </select>

      <label style="display:flex;gap:8px;align-items:center">

        <input
          type="checkbox"
          class="option-required"
          ${option.required ? "checked" : ""}
          style="width:auto">

        خيار إلزامي

      </label>

      <div class="option-values">

        <h4>قيم الخيار</h4>

        <div class="values-container"></div>

        <button
          class="gray"
          onclick="addOptionValue(${index})">
          ＋ إضافة قيمة
        </button>

      </div>

      <button
        class="danger"
        style="margin-top:12px"
        onclick="removeOption(${index})">
        حذف الخيار
      </button>
    `;

    box.appendChild(div);

    const valuesBox =
      div.querySelector(".values-container");

    (option.values || []).forEach((value, valueIndex) => {

      addOptionValue(index, value, valuesBox);
    });

  });
}


function addOptionValue(optionIndex, value = null, target = null) {

  const option = productOptions[optionIndex];

  if (!option.values) {
    option.values = [];
  }

  if (!value) {

    value = {
      label_ar: "",
      label_en: "",
      price_delta: 0
    };

    option.values.push(value);
  }

  const box =
    target ||
    document.querySelectorAll(".values-container")[optionIndex];

  if (!box) return;

  const row = document.createElement("div");

  row.style.cssText =
    "border:1px solid #ddd;padding:10px;border-radius:10px;margin-top:8px;background:white";

  row.innerHTML = `

    <label>القيمة بالعربي</label>

    <input
      class="value-ar"
      value="${escapeHtml(value.label_ar || "")}"
      placeholder="بيج">

    <label>القيمة بالإنجليزي</label>

    <input
      class="value-en"
      value="${escapeHtml(value.label_en || "")}"
      placeholder="Beige">

    <label>فرق السعر</label>

    <input
      class="value-price"
      type="number"
      step="0.01"
      value="${Number(value.price_delta || 0)}">

    <button
      class="danger"
      style="margin-top:8px"
      onclick="removeOptionValue(${optionIndex}, this)">
      حذف القيمة
    </button>

  `;

  box.appendChild(row);
}


function removeOptionValue(optionIndex, button) {

  const row = button.parentElement;

  const box = row.parentElement;

  const rows = Array.from(box.children);

  const index = rows.indexOf(row);

  if (index >= 0) {

    productOptions[optionIndex].values.splice(index, 1);
  }

  row.remove();
}


function removeOption(index) {

  productOptions.splice(index, 1);

  renderOptions();
}


// ==========================================
// جمع الخيارات
// ==========================================

function collectOptions() {

  const optionCards =
    document.querySelectorAll(".option");

  const result = [];

  optionCards.forEach((card, index) => {

    const option = {

      name_ar:
        card.querySelector(".option-ar").value.trim(),

      name_en:
        card.querySelector(".option-en").value.trim(),

      type:
        card.querySelector(".option-type").value,

      required:
        card.querySelector(".option-required").checked,

      values: []

    };

    card.querySelectorAll(".values-container > div")
      .forEach(row => {

        option.values.push({

          label_ar:
            row.querySelector(".value-ar").value.trim(),

          label_en:
            row.querySelector(".value-en").value.trim(),

          price_delta:
            Number(
              row.querySelector(".value-price").value || 0
            )

        });

      });

    if (
      option.name_ar ||
      option.name_en ||
      option.values.length
    ) {

      result.push(option);
    }

  });

  return result;
}


// ==========================================
// حفظ المنتج
// ==========================================

async function saveProduct() {

  const status =
    document.getElementById("saveStatus");

  status.classList.remove("hidden");

  status.innerHTML =
    "⏳ جاري حفظ المنتج...";

  const id =
    document.getElementById("productId").value;

  const manualUrls =
    Array.from(
      document.querySelectorAll(".manual-url")
    )
    .map(input => input.value.trim())
    .filter(Boolean);

  const allImages = [
    ...uploadedImages.map(image => ({
      url: image.url
    })),

    ...manualUrls.map(url => ({
      url
    }))
  ];

  if (!allImages.length) {

    status.innerHTML =
      "⚠️ أضف صورة واحدة على الأقل للمنتج.";

    return;
  }

  const payload = {

    name_ar:
      document.getElementById("nameAr").value.trim(),

    name_en:
      document.getElementById("nameEn").value.trim(),

    category:
      document.getElementById("category").value.trim(),

    stock:
      Number(document.getElementById("stock").value || 0),

    price:
      Number(document.getElementById("price").value || 0),

    compare_price:
      Number(
        document.getElementById("comparePrice").value || 0
      ),

    description_ar:
      document.getElementById("descriptionAr").value.trim(),

    description_en:
      document.getElementById("descriptionEn").value.trim(),

    image:
      allImages[0]?.url || "",

    images:
      allImages,

    options:
      collectOptions(),

    active: 1

  };


  if (!payload.name_ar && !payload.name_en) {

    status.innerHTML =
      "⚠️ اكتب اسم المنتج.";

    return;
  }


  try {

    const url = id
      ? `/api/products/${id}`
      : `/api/products`;

    const method = id
      ? "PUT"
      : "POST";

    const response = await fetch(url, {

      method,

      credentials: "include",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(payload)

    });

    const data = await response.json();

    if (!response.ok) {

      console.error(data);

      status.innerHTML =
        "❌ فشل حفظ المنتج: " +
        (data.error || "خطأ غير معروف");

      return;
    }

    status.innerHTML =
      "✅ تم حفظ المنتج وجميع الصور بنجاح.";

    await loadProducts();

    setTimeout(() => {

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }, 500);

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ حدث خطأ أثناء الاتصال بالسيرفر.";
  }
}


// ==========================================
// تعديل المنتج
// ==========================================

function editProduct(product) {

  document.getElementById("formTitle").textContent =
    "✏️ تعديل المنتج";

  document.getElementById("productId").value =
    product.id || "";

  document.getElementById("nameAr").value =
    product.name_ar || "";

  document.getElementById("nameEn").value =
    product.name_en || "";

  document.getElementById("category").value =
    product.category || "";

  document.getElementById("stock").value =
    product.stock || 0;

  document.getElementById("price").value =
    product.price || 0;

  document.getElementById("comparePrice").value =
    product.compare_price || 0;

  document.getElementById("descriptionAr").value =
    product.description_ar || "";

  document.getElementById("descriptionEn").value =
    product.description_en || "";


  uploadedImages = [];

  if (Array.isArray(product.images)) {

    uploadedImages = product.images
      .map(image => {

        if (typeof image === "string") {

          return {
            url: image
          };

        }

        return {
          url: image.url
        };

      })
      .filter(image => image.url);

  }


  if (
    !uploadedImages.length &&
    product.image
  ) {

    uploadedImages = [{
      url: product.image
    }];
  }


  productOptions =
    Array.isArray(product.options)
      ? JSON.parse(JSON.stringify(product.options))
      : [];


  renderImages();

  renderOptions();

  document.getElementById("manualUrls").innerHTML =
    "";


  window.scrollTo({

    top:
      document.getElementById("productForm").offsetTop - 70,

    behavior: "smooth"

  });
}


// ==========================================
// حذف المنتج
// ==========================================

async function deleteProduct(id) {

  if (!confirm("هل أنت متأكد من حذف المنتج؟")) {
    return;
  }

  try {

    const response = await fetch(
      `/api/products/${id}`,
      {
        method: "DELETE",
        credentials: "include"
      }
    );

    if (!response.ok) {

      alert("فشل حذف المنتج");

      return;
    }

    await loadProducts();

  } catch (error) {

    console.error(error);

    alert("حدث خطأ أثناء الحذف");
  }
}


// ==========================================
// الطلبات
// ==========================================

async function loadOrders() {

  const box =
    document.getElementById("ordersList");

  try {

    const response = await fetch(
      "/api/orders",
      {
        credentials: "include"
      }
    );

    if (!response.ok) {

      box.innerHTML =
        "تعذر تحميل الطلبات";

      return;
    }

    const orders =
      await response.json();

    if (!orders.length) {

      box.innerHTML = `
        <div class="empty">
          لا توجد طلبات حتى الآن
        </div>
      `;

      return;
    }

    box.innerHTML =
      orders.map(order => `

        <div class="order">

          <strong>
            #${escapeHtml(
              String(order.order_no || order.id)
            )}
          </strong>

          <p>
            العميل:
            ${escapeHtml(order.customer_name || "")}
          </p>

          <p>
            الهاتف:
            ${escapeHtml(order.phone || "")}
          </p>

          <p>
            المدينة:
            ${escapeHtml(order.city || "")}
          </p>

          <p>
            الإجمالي:
            ${Number(order.total || 0).toFixed(2)}
          </p>

          <label>حالة الطلب</label>

          <select
            onchange="updateOrderStatus(${order.id}, this.value)">

            <option
              value="new"
              ${order.status === "new" ? "selected" : ""}>
              طلب جديد
            </option>

            <option
              value="processing"
              ${order.status === "processing" ? "selected" : ""}>
              قيد التجهيز
            </option>

            <option
              value="ready"
              ${order.status === "ready" ? "selected" : ""}>
              جاهز للتسليم
            </option>

            <option
              value="delivered"
              ${order.status === "delivered" ? "selected" : ""}>
              تم التسليم
            </option>

            <option
              value="cancelled"
              ${order.status === "cancelled" ? "selected" : ""}>
              ملغي
            </option>

          </select>

          <div class="actions">

            <button
              class="primary"
              onclick="openInvoice(${order.id})">
              🧾 الفاتورة
            </button>

          </div>

        </div>

      `).join("");

  } catch (error) {

    console.error(error);

    box.innerHTML =
      "حدث خطأ أثناء تحميل الطلبات";
  }
}


// ==========================================
// تحديث حالة الطلب
// ==========================================

async function updateOrderStatus(id, status) {

  try {

    const response = await fetch(
      `/api/orders/${id}`,
      {
        method: "PATCH",

        credentials: "include",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          status
        })
      }
    );

    if (!response.ok) {

      alert("فشل تحديث حالة الطلب");

      return;
    }

  } catch (error) {

    console.error(error);

    alert("حدث خطأ");
  }
}


// ==========================================
// الفاتورة
// ==========================================

function openInvoice(id) {

  window.open(
    `/api/invoice/${id}`,
    "_blank"
  );
}


// ==========================================
// حماية النصوص
// ==========================================

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


// ==========================================
// تشغيل الصفحة
// ==========================================

async function init() {

  const authenticated =
    await checkAuth();

  if (!authenticated) {
    return;
  }

  await loadProducts();

  await loadOrders();

  newProduct();
}


init();

</script>
