<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم | ZOMURUD</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f6f3;
  color:#14211b;
}

header{
  background:#0e1713;
  color:white;
  padding:18px 20px;
  position:sticky;
  top:0;
  z-index:10;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
  letter-spacing:3px;
}

.admin{
  opacity:.8;
  font-size:14px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px 60px;
}

h1{
  margin:10px 0 25px;
}

h2{
  margin-top:0;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:22px;
  box-shadow:0 4px 18px #00000010;
}

.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #d5ddd8;
  border-radius:10px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  font-size:16px;
  cursor:pointer;
}

.primary{
  background:#14211b;
  color:white;
}

.green{
  background:#238636;
  color:white;
}

.red{
  background:#c62828;
  color:white;
}

.gray{
  background:#e9eeeb;
  color:#14211b;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.product{
  border:1px solid #e0e5e2;
  border-radius:14px;
  overflow:hidden;
  background:white;
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#eef1ee;
}

.product-body{
  padding:14px;
}

.product-name{
  font-weight:bold;
  font-size:18px;
}

.price{
  margin:8px 0;
  font-size:18px;
  font-weight:bold;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.actions button{
  flex:1;
  min-width:90px;
  font-size:14px;
  padding:10px;
}

.orders{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:750px;
}

th,td{
  padding:13px 10px;
  border-bottom:1px solid #e5e9e6;
  text-align:right;
}

th{
  background:#f1f4f2;
}

.status{
  padding:7px 10px;
  border-radius:20px;
  background:#e9eeeb;
}

.message{
  display:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  background:#e8f5e9;
  color:#17652a;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 4px 18px #00000008;
}

.stat b{
  display:block;
  font-size:30px;
  margin-top:8px;
}

@media(max-width:700px){
  .form{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">ZOMURUD</div>
    <div class="admin">لوحة تحكم المتجر</div>
  </div>
</header>

<div class="container">

<h1>لوحة التحكم</h1>

<div id="message"
