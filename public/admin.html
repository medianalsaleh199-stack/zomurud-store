<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>ZOMURUD Admin</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f4ef;
color:#14211b
}

.wrap{
max-width:1200px;
margin:auto;
padding:22px
}

.head{
display:flex;
justify-content:space-between;
align-items:center
}

.brand{
font:700 25px Georgia
}

.btn{
background:#173128;
color:#fff;
border:0;
padding:10px 14px;
border-radius:5px;
cursor:pointer;
text-decoration:none
}

.btn:disabled{
opacity:.6;
cursor:not-allowed
}

.danger{
background:#933
}

.stats{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin:20px 0
}

.stat,
.panel{
background:#fff;
border:1px solid #e3dfd6;
padding:16px
}

.stat b{
display:block;
font-size:24px;
margin-top:8px
}

.panel{
margin-top:15px
}

.form{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px
}

.form input,
.form textarea{
padding:11px;
border:1px solid #ddd;
border-radius:5px;
box-sizing:border-box
}

.form textarea{
min-height:65px
}

.upload{
border:2px dashed #bbb;
padding:20px;
margin-bottom:15px;
text-align:center;
border-radius:8px;
background:#fafafa
}

.preview{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:12px
}

.preview img{
width:110px;
height:90px;
object-fit:cover;
border-radius:6px;
border:1px solid #ddd
}

.status{
margin-top:10px;
font-size:14px
}

.success{
color:#16753b
}

.error{
color:#b00020
}

table{
width:100%;
border-collapse:collapse
}

td,
th{
padding:9px;
border-bottom:1px solid #eee;
text-align:right;
font-size:12px
}

.table{
overflow:auto
}

.mini{
padding:6px 9px;
font-size:10px
}

@media(max-width:800px){

.stats{
grid-template-columns:repeat(2,1fr)
}

.form{
grid-template-columns:1fr
}

.head{
display:block
}

}

</style>

</head>

<body>

<div class="wrap">

<div class="head">

<div>

<div class="brand">
ZOMURUD | الزمرد
</div>

<small>
لوحة التحكم
</small>

</div>

<a
class="btn"
href="/"
>
المتجر
</a>

</div>

<div
id="stats"
class="stats"
></div>


<div class="panel">

<h2>
إضافة منتج
</h2>

<form
id="add"
class="form"
>

<input
name="name_ar"
required
placeholder="اسم المنتج بالعربي"
>

<input
name="name_en"
required
placeholder="Product name"
>

<input
name="category"
required
placeholder="التصنيف"
>

<input
name="price"
type="number"
min="0"
required
placeholder="السعر AED"
>

<input
name="compare_price"
type="number"
min="0"
placeholder="قبل الخصم"
>

<input
name="stock"
type="number"
min="0"
placeholder="المخزون"
>


<div
class="upload"
style="grid-column:1/-1"
>

<strong>
صور المنتج
</strong>

<p>
اختر صورة أو عدة صور من الهاتف أو الكمبيوتر.
</p>

<input
id="images"
type="file"
accept="image/*"
multiple
>

<div
id="preview"
class="preview"
></div>

<div
id="uploadStatus"
class="status"
></div>

</div>


<input
type="hidden"
name="image"
id="imageUrl"
>

<textarea
name="description_ar"
placeholder="الوصف بالعربي"
></textarea>

<textarea
name="description_en"
placeholder="Description"
></textarea>

<button
id="addBtn"
class="btn"
type="submit"
>
إضافة المنتج
</button>

</form>

</div>


<div class="panel table">

<h2>
المنتجات
</h2>

<table>

<thead>

<tr>

<th>
المنتج
</th>

<th>
الفئة
</th>

<th>
السعر
</th>

<th>
المخزون
</th>

<th>
إجراء
</th>

</tr>

</thead>

<tbody
id="products"
></tbody>

</table>

</div>


<div class="panel table">

<h2>
الطلبات والفواتير
</h2>

<table>

<thead>

<tr>

<th>
الطلب
</th>

<th>
العميل
</th>

<th>
الهاتف
</th>

<th>
الإجمالي
</th>

<th>
الحالة
</th>

<th>
PDF
</th>

</tr>

</thead>

<tbody
id="orders"
></tbody>

</table>

</div>

</div>


<script>

const $ =
s => document.querySelector(s);

const money =
n =>
"AED " +
Number(n).toLocaleString();

let uploadedImages = [];


/* =========================
   IMAGE UPLOAD
========================= */

$("#images")
.addEventListener(
"change",
async function(){

const files =
Array.from(
this.files || []
);

$("#preview")
.innerHTML = "";

$("#uploadStatus")
.textContent = "";

$("#uploadStatus")
.className = "status";

uploadedImages = [];

$("#imageUrl")
.value = "";

if(!files.length){

return;

}


/* PREVIEW */

files.forEach(
file => {

const img =
document.createElement(
"img"
);

img.src =
URL.createObjectURL(
file
);

$("#preview")
.appendChild(
img
);

});


$("#uploadStatus")
.textContent =
"جاري رفع الصور...";


try{

const form =
new FormData();

files.forEach(
file => {

form.append(
"images",
file
);

});


const response =
await fetch(
"/api/admin/upload-image",
{
method:"POST",
body:form
}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"فشل رفع الصور"
);

}


uploadedImages =
data.images || [];


if(
uploadedImages.length
){

$("#imageUrl")
.value =
uploadedImages[0].url;

}


$("#uploadStatus")
.textContent =
"تم رفع " +
uploadedImages.length +
" صورة بنجاح ✓";

$("#uploadStatus")
.className =
"status success";


}catch(error){

console.error(
error
);

$("#uploadStatus")
.textContent =
"❌ " +
error.message;

$("#uploadStatus")
.className =
"status error";

}

});


/* =========================
   REFRESH
========================= */

async function refresh(){

try{

const [
statsResponse,
productsResponse,
ordersResponse
] = await Promise.all([

fetch(
"/api/stats"
),

fetch(
"/api/products"
),

fetch(
"/api/orders"
)

]);


const stats =
await statsResponse.json();

const products =
await productsResponse.json();

const orders =
await ordersResponse.json();


$("#stats")
.innerHTML = [

[
"المبيعات",
money(stats.revenue)
],

[
"الطلبات",
stats.orders
],

[
"العملاء",
stats.customers
],

[
"المنتجات",
stats.products
],

[
"مخزون منخفض",
stats.low
]

].map(
item =>

`<div class="stat">
${item[0]}
<b>${item[1]}</b>
</div>`

).join("");


$("#products")
.innerHTML =
products.map(
product => `

<tr>

<td>

${
product.image
?
`
<img
src="${product.image}"
style="
width:50px;
height:40px;
object-fit:cover;
vertical-align:middle;
border-radius:4px
"
>
`
:
""
}

${product.name_ar}

</td>

<td>
${product.category}
</td>

<td>
${money(product.price)}
</td>

<td>
${product.stock}
</td>

<td>

<button
class="btn danger mini"
onclick="del(${product.id})"
>
حذف
</button>

</td>

</tr>

`
).join("");


$("#orders")
.innerHTML =
orders.map(
order => `

<tr>

<td>
${order.order_no}
</td>

<td>
${order.customer_name}
</td>

<td>
${order.phone}
</td>

<td>
${money(order.total)}
</td>

<td>

<select
onchange="st(
${order.id},
this.value
)"
>

${
[
"NEW",
"CONFIRMED",
"PROCESSING",
"READY",
"SHIPPED",
"DELIVERED",
"CANCELLED"
]

.map(
status => `

<option
value="${status}"
${
status === order.status
?
"selected"
:
""
}
>
${status}
</option>

`
)
.join("")
}

</select>

</td>

<td>

<a
class="btn mini"
href="/api/invoice/${order.id}"
target="_blank"
>
PDF
</a>

</td>

</tr>

`
).join("");


}catch(error){

console.error(
"Refresh error:",
error
);

}

}


/* =========================
   ADD PRODUCT
========================= */

$("#add")
.addEventListener(
"submit",
async function(e){

e.preventDefault();


if(
!$("#imageUrl").value
){

const confirmAdd =
confirm(
"لم يتم رفع صورة. هل تريد إضافة المنتج بدون صورة؟"
);

if(!confirmAdd){

return;

}

}


const data =
Object.fromEntries(
new FormData(this)
);


const button =
$("#addBtn");


button.disabled =
true;

button.textContent =
"جاري الحفظ...";


try{

const response =
await fetch(
"/api/products",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(data)

});


const result =
await response.json();


if(!response.ok){

throw new Error(
result.error ||
"حدث خطأ"
);

}


alert(
"تم إضافة المنتج بنجاح ✓"
);


this.reset();

$("#preview")
.innerHTML = "";

$("#uploadStatus")
.textContent = "";

$("#uploadStatus")
.className =
"status";

$("#imageUrl")
.value = "";

uploadedImages = [];


await refresh();


}catch(error){

alert(
error.message
);

}finally{

button.disabled =
false;

button.textContent =
"إضافة المنتج";

}

});


/* =========================
   DELETE
========================= */

async function del(id){

if(
confirm(
"هل تريد حذف المنتج؟"
)
){

await fetch(
"/api/products/" +
id,
{
method:"DELETE"
}
);

await refresh();

}

}


/* =========================
   ORDER STATUS
========================= */

async function st(
id,
status
){

await fetch(
"/api/orders/" +
id,
{

method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
status
})

}
);

await refresh();

}


/* =========================
   START
========================= */

refresh();

</script>

</body>

</html>
