<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOMURUD Admin</title><style>
body{margin:0;background:#f5f4ef;color:#15231c;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:35px 18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font:700 24px Georgia}.btn{border:0;background:#173128;color:white;padding:11px 16px;border-radius:4px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:25px 0}.stat{background:white;padding:20px;border:1px solid #e5e1d8}.stat b{font-size:25px;display:block;margin-top:7px}.panel{background:white;border:1px solid #e5e1d8;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid input,.grid textarea,.grid select{padding:11px;border:1px solid #ddd}.grid textarea{min-height:70px}.products{overflow:auto}.products table{width:100%;border-collapse:collapse}.products th,.products td{padding:12px;border-bottom:1px solid #eee;text-align:right;font-size:12px}.danger{background:#8d3030}.small{padding:7px 9px;font-size:11px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{display:block}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">ZOMURUD | الزمرد</div><small>لوحة الإدارة</small></div><a class="btn" href="/">فتح المتجر</a></div>
<div class="stats" id="stats"></div>
<div class="panel"><h2>إضافة منتج</h2><form id="addForm" class="grid"><input name="name_ar" required placeholder="اسم المنتج بالعربي"><input name="name_en" required placeholder="Product name"><input name="category" required placeholder="التصنيف"><input name="price" type="number" required placeholder="السعر AED"><input name="compare_price" type="number" placeholder="السعر قبل الخصم"><input name="stock" type="number" placeholder="المخزون"><input name="image" placeholder="رابط صورة المنتج"><textarea name="description_ar" placeholder="الوصف بالعربي"></textarea><textarea name="description_en" placeholder="Description"></textarea><button class="btn" type="submit">إضافة المنتج</button></form></div>
<div class="panel products"><h2>المنتجات</h2><table><thead><tr><th>المنتج</th><th>التصنيف</th><th>السعر</th><th>المخزون</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="panel products"><h2>الطلبات</h2><table><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody id="orders"></tbody></table></div></div>
<script>
const $=s=>document.querySelector(s),money=n=>"AED "+Number(n).toLocaleString();
async function refresh(){let [s,p,o]=await Promise.all([fetch("/api/stats").then(r=>r.json()),fetch("/api/products").then(r=>r.json()),fetch("/api/orders").then(r=>r.json())]);$("#stats").innerHTML=[["المبيعات",money(s.revenue)],["الطلبات",s.orders],["العملاء",s.customers],["المنتجات",s.products],["مخزون منخفض",s.low]].map(x=>`<div class=stat>${x[0]}<b>${x[1]}</b></div>`).join("");$("#tbody").innerHTML=p.map(x=>`<tr><td>${x.name_ar}</td><td>${x.category}</td><td>${money(x.price)}</td><td>${x.stock}</td><td><button class="btn danger small" onclick="del(${x.id})">حذف</button></td></tr>`).join("");$("#orders").innerHTML=o.map(x=>`<tr><td>${x.order_no}</td><td>${x.customer_name}</td><td>${x.phone}</td><td>${money(x.total)}</td><td><select onchange="status(${x.id},this.value)">${["NEW","CONFIRMED","PROCESSING","READY","SHIPPED","DELIVERED","CANCELLED"].map(z=>`<option ${x.status===z?"selected":""}>${z}</option>`).join("")}</select></td></tr>`).join("")}
$("#addForm").onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));await fetch("/api/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});e.target.reset();refresh()};
async function del(id){if(confirm("حذف المنتج؟")){await fetch("/api/products/"+id,{method:"DELETE"});refresh()}}
async function status(id,status){await fetch("/api/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});refresh()}
refresh();
</script></body></html>
