<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="متجر زمرد - منتجات وتجهيزات العرض والفعاليات">
<title>زمرد | متجر الزمرد</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Tahoma",sans-serif;
  background:#f6f7f5;
  color:#14211b;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.top{
  background:#0e1713;
  color:#fff;
  text-align:center;
  padding:11px;
  font-size:14px;
}

header{
  background:#fff;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 12px #0001;
}

.nav{
  max-width:1200px;
  margin:auto;
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:12px 20px;
}

.logo{
  font-size:29px;
  font-weight:bold;
  letter-spacing:5px;
}

.logo small{
  display:block;
  font-size:11px;
  letter-spacing:1px;
  color:#777;
  text-align:center;
  margin-top:3px;
}

.navBtns{
  display:flex;
  gap:10px;
}

.iconBtn{
  border:0;
  background:#f0f2ee;
  border-radius:50%;
  width:54px;
  height:54px;
  position:relative;
  font-size:24px;
}

.badge{
  position:absolute;
  top:-3px;
  left:-2px;
  background:#14211b;
  color:#fff;
  min-width:22px;
  height:22px;
  border-radius:20px;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero{
  min-height:510px;
  background:#102019;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:70px 20px;
}

.heroContent{max-width:850px}

.english{
  letter-spacing:6px;
  color:#aeb9b2;
  font-size:13px;
  font-weight:bold;
}

.hero h1{
  font-size:58px;
  margin:20px 0 15px;
  line-height:1.2;
}

.hero p{
  color:#d7ded9;
  font-size:20px;
  line-height:1.9;
}

.heroBtns{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:30px;
  flex-wrap:wrap;
}

.primary,.secondary{
  padding:16px 32px;
  border-radius:7px;
  font-weight:bold;
  border:1px solid #fff;
}

.primary{
  background:#dce5df;
  color:#14211b;
}

.secondary{
  background:transparent;
  color:#fff;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:60px 20px;
}

.sectionTitle{
  text-align:center;
  margin-bottom:30px;
}

.sectionTitle h2{
  font-size:34px;
  margin:0 0 8px;
}
