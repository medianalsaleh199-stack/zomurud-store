<!doctype html><html lang="ar" dir="rtl"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOMURUD Admin</title><style>
body{font-family:Arial;margin:0;background:#f5f4ef;color:#14211b}.wrap{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font:700 25px Georgia}.btn{background:#173128;color:#fff;border:0;padding:10px 14px;border-radius:4px}.danger{background:#933}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.stat,.panel{background:#fff;border:1px solid #e3dfd6;padding:16px}.stat b{display:block;font-size:24px;margin-top:8px}.panel{margin-top:15px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.form input,.form textarea{padding:10px;border:1px solid #ddd}.form textarea{min-height:65px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:right;font-size:12px}.table{overflow:auto}.mini{padding:6px 9px;font-size:10px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.head{display:block}}
</style><div class=wrap><div class=head><div><div class=brand>ZOMURUD | الزمرد</div><small>لوحة التحكم</small></div><a class=btn href="/">المتجر</a></div><div id=stats class=stats></div>
<div class=panel><h2>إضافة منتج</h2><form id=add class=form><input name=name_ar required placeholder="اسم المنتج بالعربي"><input name=name_en required placeholder="Product name"><input name=category required placeholder="التصنيف"><input name=price type=number required placeholder="السعر AED"><input name=compare_price type=number placeholder="قبل الخصم"><input name=stock type=number placeholder="المخزون"><input name=image placeholder="رابط الصورة"><textarea name=description_ar placeholder="الوصف بالعربي"></textarea><textarea name=description_en placeholder="Description"></textarea><button class=btn>إضافة المنتج</button></form></div>
<div class="panel table"><h2>المنتجات</h2><table><thead><tr><th>المنتج</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th>إجراء</th></tr></thead><tbody id=products></tbody></table></div>
<div class="panel table"><h2>الطلبات والفواتير</h2><table><thead><tr><th>الطلب</th><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>الحالة</th><th>PDF</th></tr></thead><tbody id=orders></tbody></table></div></div>
<script>
const $=s=>document.querySelector(s),money=n=>"AED "+Number(n).toLocaleString();
async function refresh(){let [s,p,o]=await Promise.all([fetch("/api/stats").then(x=>x.json()),fetch("/api/products").then(x=>x.json()),fetch("/api/orders").then(x=>x.json())]);$("#stats").innerHTML=[["المبيعات",money(s.revenue)],["الطلبات",s.orders],["العملاء",s.customers],["المنتجات",s.products],["مخزون منخفض",s.low]].map(a=>`<div class=stat>${a[0]}<b>${a[1]}</b></div>`).join("");$("#products").innerHTML=p.map(x=>`<tr><td>${x.name_ar}</td><td>${x.category}</td><td>${money(x.price)}</td><td>${x.stock}</td><td><button class="btn danger mini" onclick="del(${x.id})">حذف</button></td></tr>`).join("");$("#orders").innerHTML=o.map(x=>`<tr><td>${x.order_no}</td><td>${x.customer_name}</td><td>${x.phone}</td><td>${money(x.total)}</td><td><select onchange="st(${x.id},this.value)">${["NEW","CONFIRMED","PROCESSING","READY","SHIPPED","DELIVERED","CANCELLED"].map(z=>`<option ${z==x.status?"selected":""}>${z}</option>`).join("")}</select></td><td><a class="btn mini" href="/api/invoice/${x.id}" target=_blank>PDF</a></td></tr>`).join("")}
$("#add").onsubmit=async e=>{e.preventDefault();await fetch("/api/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();refresh()};async function del(id){if(confirm("حذف المنتج؟")){await fetch("/api/products/"+id,{method:"DELETE"});refresh()}}async function st(id,status){await fetch("/api/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});refresh()}refresh();
</script>
